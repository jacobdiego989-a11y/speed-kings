<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Formulario Básico</title>
  <style>
    body {
      background-color: black;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
      text-align: center;
    }

    h1 {
      text-align: center;
      color: lime;
    }

    form {
      max-width: 500px;
      margin: auto;
      text-align: left;
    }

    label {
      display: block;
      margin-top: 15px;
      margin-bottom: 5px;
    }

    input, select, textarea {
      width: 100%;
      padding: 8px;
      background-color: #1a1a1a;
      border: 1px solid lime;
      color: white;
      font-size: 14px;
      box-sizing: border-box;
    }

    input[type="submit"] {
      margin-top: 20px;
      background-color: lime;
      color: black;
      font-weight: bold;
      cursor: pointer;
    }

    input[type="submit"]:hover {
      background-color: white;
      color: black;
    }

    a {
      margin-top: 24px;
      display: inline-block;
      text-decoration: underline;
      color: lime;
    }
  </style>
</head>
<body>

  <h1>Formulario</h1>

  <form action="#" method="post">
    <label for="nombre">1. ¿Cuál es tu nombre?</label>
    <input type="text" id="nombre" name="nombre">

    <label for="edad">2. ¿Cuántos años tienes?</label>
    <input type="number" id="edad" name="edad">

    <label for="marca">3. ¿Qué marca te gustó más?</label>
    <select id="marca" name="marca">
      <option>McLaren</option>
      <option>Porsche</option>
      <option>Ferrari</option>
      <option>Lamborghini</option>
      <option>Bugatti</option>
    </select>

    <label for="modelo">4. ¿Qué modelo te gustó más?</label>
    <input type="text" id="modelo" name="modelo">

    <label for="interes">5. ¿Te gustan los autos deportivos?</label>
    <select id="interes" name="interes">
      <option>Sí</option>
      <option>No</option>
    </select>

    <label for="aprendizaje">6. ¿Aprendiste algo nuevo?</label>
    <select id="aprendizaje" name="aprendizaje">
      <option>Sí</option>
      <option>No</option>
    </select>

    <label for="comentarios">7. ¿Quieres dejar un comentario?</label>
    <textarea id="comentarios" name="comentarios"></textarea>

    <input type="submit" value="Enviar">
  </form>

  <a href="index.html">¡Pulsa aquí para volver a la página principal!</a>
</body>
</html>
